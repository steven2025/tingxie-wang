<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no,email=no">
<meta name="theme-color" content="#f5f7fb">
<!-- PWA 安装支持 -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="听写台">
<title>生字词语听写</title>
<style>
  /* ============ 全局：清爽简洁 + 移动端/平板友好 ============ */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --bg:#f5f7fb; --card:#ffffff;
    --txt:#2b3554; --sub:#8a94b0;
    --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --violet:#8b5cf6;
    --line:#e3e8f2;
    /* 响应式尺寸：手机→平板自动缩放；vw 保证任何宽度不溢出 */
    --btn-side: clamp(84px, 23vw, 132px);       /* 上一个/下一个（方形） */
    --btn-replay: clamp(102px, 28vw, 160px);    /* 重听（圆形，最大） */
    --btn-fs-icon: clamp(24px, 6.5vw, 32px);
    --btn-fs-label: clamp(13px, 3.6vw, 16px);
    --progress-fs: clamp(54px, 16vw, 88px);     /* 中央进度数字 */
    --progress-sub-fs: clamp(32px, 9vw, 56px);
    --title-fs: clamp(14px, 4vw, 18px);
    --mode-fs: clamp(15px, 4.2vw, 18px);
  }
  html,body { height:100%; }
  html { overscroll-behavior:none; }
  body {
    font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#f0f4ff 0%, #f6f4fb 60%, #eef6f1 100%);
    background-attachment:fixed;
    color:var(--txt); user-select:none; -webkit-user-select:none;
    overflow:hidden; touch-action:manipulation; -webkit-font-smoothing:antialiased;
  }
  .app {
    position:relative; width:100%; max-width:min(720px,100%); margin:0 auto;
    height:100vh; height:100dvh; display:flex; flex-direction:column;
  }

  /* ============ 顶部：教材 / 课次 隐藏式下拉 ============ */
  header {
    display:flex; gap:8px; align-items:center;
    padding:calc(8px + env(safe-area-inset-top)) 14px 4px; z-index:20;
  }
  .picker {
    position:relative; display:flex; align-items:center; gap:6px;
    padding:11px 14px; border-radius:14px; background:var(--card);
    border:1px solid var(--line); box-shadow:0 2px 8px rgba(43,53,84,.06);
    font-size:var(--title-fs); font-weight:600; color:var(--txt); cursor:pointer;
    min-height:44px; transition:transform .08s;
  }
  .picker:active { transform:scale(.97); }
  .picker .arrow { font-size:11px; color:var(--sub); flex:0 0 auto; transition:transform .2s; }
  .picker.open .arrow { transform:rotate(180deg); }
  .picker#bookPicker { color:var(--violet); flex:0 0 auto; }
  /* 课次选择器：弹性收缩，长课名省略号 */
  .picker#lessonPicker { flex:1; min-width:0; }
  #lessonName { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .dropdown {
    position:absolute; top:calc(100% + 8px); width:max-content; min-width:170px;
    max-width:min(84vw,300px); background:var(--card); border:1px solid var(--line);
    border-radius:16px; box-shadow:0 16px 40px rgba(43,53,84,.18); padding:6px; display:none;
    max-height:min(50vh,400px); overflow-y:auto; -webkit-overflow-scrolling:touch; z-index:30;
  }
  .dropdown.open { display:block; }
  #lessonDropdown { left:auto; right:0; }
  .dropdown button {
    display:block; width:100%; text-align:left; padding:12px 16px;
    border:none; background:none; border-radius:11px; font-size:15px;
    color:var(--txt); cursor:pointer; font-family:inherit; min-height:44px;
  }
  .dropdown button:active { background:#eef2ff; }
  .dropdown button.active { background:var(--blue); color:#fff; font-weight:600; }

  /* ============ 顶部信息条：模式 + 进度 + 课名（紧凑横排） ============ */
  .info-bar {
    display:flex; align-items:center; justify-content:center; flex-wrap:wrap;
    gap:6px 14px; padding:8px 12px 6px; z-index:5;
  }
  .mode-switch { display:flex; gap:8px; }
  .mode-chip {
    padding:8px 24px; border-radius:999px; border:1.5px solid var(--line);
    background:var(--card); color:var(--sub); font-size:var(--mode-fs); font-weight:600;
    letter-spacing:3px; cursor:pointer; font-family:inherit; min-height:40px;
    transition:transform .08s, box-shadow .2s;
  }
  .mode-chip:active { transform:scale(.96); }
  .mode-chip.active { background:var(--blue); color:#fff; border-color:var(--blue); box-shadow:0 4px 14px rgba(59,130,246,.30); }
  .progress { font-size:clamp(24px,6.5vw,34px); font-weight:700; letter-spacing:1px; color:var(--txt); line-height:1; display:flex; align-items:baseline; gap:3px; }
  .progress b { color:var(--blue); }
  .progress-total { font-size:clamp(15px,4vw,20px); color:var(--sub); font-weight:600; }
  .lesson-name { font-size:clamp(12px,3.2vw,15px); color:var(--sub); letter-spacing:2px; max-width:40vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ============ 主操作区：三个巨大按键（屏幕中央主角） ============ */
  .stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; padding:6px 14px; }
  .ctrl { display:flex; align-items:center; justify-content:center; gap:clamp(8px,2.2vw,18px); }
  .big-btn {
    flex:0 0 auto; border:none; cursor:pointer; font-family:inherit; font-weight:700; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:32px; transition:transform .08s, box-shadow .2s, filter .2s;
    -webkit-user-select:none; user-select:none;
  }
  .big-btn:active { transform:scale(.94); filter:brightness(.96); }
  .big-btn .icon { line-height:1; }
  .big-btn .label { font-size:var(--btn-fs-label); letter-spacing:2px; font-weight:700; }
  .big-btn.side { width:var(--btn-side); height:var(--btn-side); border-radius:34px; gap:5px; }
  .big-btn.side .icon { font-size:var(--btn-fs-icon); }
  .big-btn.prev { background:linear-gradient(145deg,#60a5fa,#2563eb); box-shadow:0 8px 0 #1d4ed8, 0 14px 26px rgba(59,130,246,.32); }
  .big-btn.next { background:linear-gradient(145deg,#fb923c,#ea580c); box-shadow:0 8px 0 #c2410c, 0 14px 26px rgba(234,88,12,.30); }
  /* 重听：中央最大圆形；深色字保证对比度 */
  .big-btn.replay { width:var(--btn-replay); height:var(--btn-replay); border-radius:50%; gap:7px;
    background:linear-gradient(145deg,#86efac,#4ade80); box-shadow:0 8px 0 #22c55e, 0 14px 26px rgba(34,197,94,.30);
    color:#14532d; }
  .big-btn.replay .icon { font-size:clamp(30px,8vw,44px); color:#14532d; }
  .big-btn.replay .label { font-size:calc(var(--btn-fs-label) + 2px); color:#14532d; }
  .big-btn.playing .icon { animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.14)} }

  /* ============ 遮罩 / Toast ============ */
  .mask { position:absolute; inset:0; background:rgba(43,53,84,.18); z-index:15; display:none; }
  .mask.open { display:block; }
  .toast {
    position:absolute; left:50%; bottom:14%; transform:translateX(-50%); z-index:40;
    background:rgba(43,53,84,.92); color:#fff; padding:11px 18px; border-radius:14px;
    font-size:14px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .toast.show { opacity:1; }

  /* ============ 手机横屏（高度受限时压缩布局） ============ */
  @media (orientation:landscape) and (max-height:520px) {
    .info-bar { gap:4px 10px; padding:4px 10px 2px; }
    .mode-chip { padding:6px 16px; min-height:32px; }
    .big-btn .label { font-size:12px; letter-spacing:1px; }
    .big-btn.side { width:clamp(58px,13vw,84px); height:clamp(58px,13vw,84px); border-radius:20px; }
    .big-btn.replay { width:clamp(68px,16vw,104px); height:clamp(68px,16vw,104px); }
    .big-btn.replay .icon { font-size:clamp(22px,5.5vw,34px); }
  }
  /* ============ 平板竖屏：内容适当加宽居中 ============ */
  @media (min-width:700px) and (orientation:portrait) {
    .app { max-width:min(640px,100%); }
  }
  /* ============ 平板/大屏横屏（高度充足）：整体加宽 ============ */
  @media (min-width:700px) and (orientation:landscape) and (min-height:521px) {
    .app { max-width:min(840px,100%); }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 顶部：教材 + 课次 隐藏式下拉 -->
  <header>
    <div class="picker" id="bookPicker">
      <span id="bookName">三年级上册</span><span class="arrow">▼</span>
      <div class="dropdown" id="bookDropdown"></div>
    </div>
    <div class="picker" id="lessonPicker">
      <span id="lessonName">第1课</span><span class="arrow">▼</span>
      <div class="dropdown" id="lessonDropdown"></div>
    </div>
  </header>

  <!-- 顶部信息条：模式切换 + 进度 + 课名 -->
  <div class="info-bar">
    <div class="mode-switch">
      <button class="mode-chip active" id="modeZh">生字</button>
      <button class="mode-chip" id="modeCy">词语</button>
    </div>
    <div class="progress"><b id="curNo">1</b><span class="progress-total" id="totalNo">/ 12</span></div>
    <div class="lesson-name" id="lessonTitle"></div>
  </div>

  <!-- 主操作区：三个巨大按键（屏幕中央主角） -->
  <main class="stage">
    <div class="ctrl">
      <button class="big-btn prev side" id="btnPrev"><span class="icon">◀</span><span class="label">上一个</span></button>
      <button class="big-btn replay" id="btnPlay">
        <span class="icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.06A4.5 4.5 0 0 0 16.5 12zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg></span>
        <span class="label">重听</span>
      </button>
      <button class="big-btn next side" id="btnNext"><span class="icon">▶</span><span class="label">下一个</span></button>
    </div>
  </main>

  <div class="mask" id="mask"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ================================================================
 * 生字词语听写 · 极简播放器（移动端/平板友好）
 * - 前端绝不显示听写字词内容，只显示 教材/课次/进度/模式。
 * - 每个生字/词组只播一遍；上一个 / 重听 / 下一个 手动控制。
 * - 教材、课次均为隐藏式下拉按钮。
 * ================================================================ */

let INDEX = null;
let curSection = null;   // 当前课次 section
let curMode = 'shengzi'; // 'shengzi' | 'ciyu'
let curIndex = 0;
let audioEl = null;
let playing = false;

function $(id) { return document.getElementById(id); }

function getList() {
  if (!curSection) return [];
  return curMode === 'shengzi' ? curSection.shengzi : curSection.ciyu;
}

/* ---------------- 下拉 ---------------- */
function setupPicker(pickerId, dropdownId, onSelect) {
  const picker = $(pickerId), dd = $(dropdownId);
  picker.addEventListener('click', (e) => {
    e.stopPropagation();
    const isOpen = dd.classList.contains('open');
    closeAllDropdowns();
    if (!isOpen) { dd.classList.add('open'); picker.classList.add('open'); $('mask').classList.add('open'); }
  });
  dd.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    onSelect(btn.dataset.idx !== undefined ? +btn.dataset.idx : btn.dataset.val);
    closeAllDropdowns();
  });
}
function closeAllDropdowns() {
  document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('.picker').forEach(p => p.classList.remove('open'));
  $('mask').classList.remove('open');
}
$('mask').addEventListener('click', closeAllDropdowns);

function renderBookDropdown() {
  const dd = $('bookDropdown');
  dd.innerHTML = '';
  const b = document.createElement('button');
  b.textContent = INDEX.book;
  b.classList.add('active');
  dd.appendChild(b);
  $('bookName').textContent = INDEX.book;
}
function renderLessonDropdown() {
  const dd = $('lessonDropdown');
  dd.innerHTML = '';
  INDEX.sections.forEach((sec, i) => {
    const b = document.createElement('button');
    b.dataset.idx = i;
    const label = sec.type === 'yuandi' ? ('语文园地' + sec.unit)
                : (sec.no + '.' + (sec.title || ('第' + sec.no + '课')));
    b.textContent = label;
    if (sec === curSection) b.classList.add('active');
    dd.appendChild(b);
  });
  $('lessonName').textContent = curSection.type === 'yuandi'
    ? ('语文园地' + curSection.unit) : (curSection.no + '.' + (curSection.title || ('第' + curSection.no + '课')));
}

/* ---------------- 界面渲染 ---------------- */
function updateStage() {
  const list = getList();
  const total = list.length;
  $('curNo').textContent = total ? (curIndex + 1) : 0;
  $('totalNo').textContent = total ? ('/ ' + total) : '';
  $('lessonTitle').textContent = curSection.type === 'yuandi'
    ? ('语文园地' + curSection.unit) : (curSection.no + '.' + (curSection.title || ''));
  $('modeZh').classList.toggle('active', curMode === 'shengzi');
  $('modeCy').classList.toggle('active', curMode === 'ciyu');
}

/* ---------------- 播放（每词播一遍） ---------------- */
function stopAudio() {
  if (audioEl) { audioEl.pause(); audioEl = null; }
  playing = false;
  $('btnPlay').classList.remove('playing');
}
function playCurrent() {
  const list = getList();
  if (!list.length) { toast('本课暂无内容'); return; }
  const item = list[curIndex];
  if (!item || !item.audio) { toast('未找到音频'); return; }
  stopAudio();
  audioEl = new Audio(item.audio);
  audioEl.preload = 'auto';
  audioEl.playbackRate = 1;
  audioEl.onended = () => { playing = false; $('btnPlay').classList.remove('playing'); audioEl = null; };
  audioEl.onerror = () => { toast('音频加载失败'); playing = false; $('btnPlay').classList.remove('playing'); };
  audioEl.play().then(() => {
    playing = true; $('btnPlay').classList.add('playing');
  }).catch(() => { toast('无法播放'); });
}
function goto(i) {
  const list = getList();
  if (!list.length) return;
  if (i < 0) i = list.length - 1;
  if (i >= list.length) i = 0;
  curIndex = i;
  updateStage();
}
function next() { stopAudio(); goto(curIndex + 1); playCurrent(); }
function prev() { stopAudio(); goto(curIndex - 1); playCurrent(); }
function replay() { playCurrent(); }

/* ---------------- 事件绑定 ---------------- */
$('btnPlay').onclick = replay;
$('btnNext').onclick = next;
$('btnPrev').onclick = prev;
$('modeZh').onclick = () => { if (curMode === 'shengzi') return; stopAudio(); curMode = 'shengzi'; curIndex = 0; updateStage(); };
$('modeCy').onclick = () => { if (curMode === 'ciyu') return; stopAudio(); curMode = 'ciyu'; curIndex = 0; updateStage(); };
setupPicker('lessonPicker', 'lessonDropdown', (idx) => {
  if (idx !== undefined && INDEX.sections[idx] !== curSection) {
    stopAudio();
    curSection = INDEX.sections[idx];
    curIndex = 0;
    renderLessonDropdown();
    updateStage();
  }
});

// 键盘支持（电脑端调试用）
document.addEventListener('keydown', (e) => {
  if (!INDEX) return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') prev();
  else if (e.key === ' ' || e.key === 'r' || e.key === 'R') { e.preventDefault(); replay(); }
});

/* ---------------- Toast ---------------- */
let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ---------------- 初始化 ---------------- */
function init() {
  if (!INDEX || !INDEX.sections || !INDEX.sections.length) { toast('索引为空'); return; }
  curSection = INDEX.sections[0];
  curIndex = 0;
  renderBookDropdown();
  renderLessonDropdown();
  updateStage();
}
function loadIndex(url) {
  return fetch(url, { cache: 'no-cache' })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { INDEX = d; init(); })
    .catch(err => { console.warn('索引加载失败', err); toast('索引加载失败'); });
}
(function () {
  const m = location.search.match(/[?&]index=([^&]+)/);
  const url = m ? decodeURIComponent(m[1]) : 'data/三年级上册_index.json';
  loadIndex(url);
})();

/* PWA：注册 Service Worker（须 HTTPS；本地/HTTP 下静默跳过） */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}

console.log('极简听写台就绪');
</script>
</body>
</html>
